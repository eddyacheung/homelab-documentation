services:
  actual-budget:
    image: actualbudget/actual-server:latest
    container_name: actual-budget
    restart: unless-stopped

    labels:
      - "com.centurylinklabs.watchtower.enable=false"

    ports:
      - "5006:5006"

    volumes:
      - /volume1/docker/actual-budget/data:/data

    environment:
      TZ: America/Chicago

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - node src/scripts/health-check.js
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  actual-auto-sync:
    image: seriouslag/actual-auto-sync:latest
    container_name: actual-auto-sync
    restart: unless-stopped

    labels:
      - "com.centurylinklabs.watchtower.enable=false"

    depends_on:
      actual-budget:
        condition: service_healthy

    environment:
      ACTUAL_SERVER_URL: "http://actual-budget:5006"
      ACTUAL_SERVER_PASSWORD: "${ACTUAL_SERVER_PASSWORD}"
      ACTUAL_BUDGET_SYNC_IDS: "${ACTUAL_BUDGET_SYNC_IDS}"
      ENCRYPTION_PASSWORDS: "${ACTUAL_ENCRYPTION_PASSWORD:-}"
      CRON_SCHEDULE: "30 6 * * *"
      TIMEZONE: "America/Chicago"
      LOG_LEVEL: "info"
      RUN_ON_START: "false"

    security_opt:
      - no-new-privileges:true
